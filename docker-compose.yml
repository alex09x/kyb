services:
  kyb:
    image: ghcr.io/alex09x/kyb:latest
    container_name: kyb
    restart: unless-stopped
    # Run as the host uid, or the canon under ./data ends up owned by root
    # and can't be read/edited by hand (and git-as-truth is the whole point).
    user: "1000:1000"
    ports:
      # Safe by default: the API has no application auth. Operators that need
      # remote private-network clients must opt into one exact interface IP.
      - "${KYB_PUBLISH_ADDR:-127.0.0.1}:9310:9310"
    volumes:
      - ./data:/data # ./data/kyb-data — git canon, ./data/index — Tantivy
