name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  e2e-macos:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build macOS binary
        run: cargo build --release
      - name: Verify Homebrew formula
        run: |
          if [ -f Formula/kyb.rb ]; then
            brew audit --strict Formula/kyb.rb || true
          fi
      - name: Run E2E test on real macOS runner
        run: |
          KYB_DATA=./test-data KYB_INDEX=./test-index ./target/release/kyb-server &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9310/healthz && break
            sleep 0.5
          done
          if [ -f skills/kyb/bin/kyb ]; then
            bash skills/kyb/bin/kyb tags || true
          fi
          kill $SERVER_PID

  docker:
    needs: [test, e2e-macos]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}:{1}', github.repository, github.ref_name) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # the image must not just build — it must boot and answer healthz
      - name: smoke test image
        run: |
          docker run -d --name kyb -p 9310:9310 ghcr.io/${{ github.repository }}:latest
          for i in $(seq 1 30); do
            curl -sf localhost:9310/healthz && exit 0
            sleep 0.5
          done
          docker logs kyb
          exit 1
