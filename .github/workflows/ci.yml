name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Validate and install agent skill
        run: bash scripts/test-skill-install.sh
      - name: Verify safe Docker Compose bind
        run: bash scripts/test-compose-bind.sh
      - name: Check deployment script syntax
        run: bash -n scripts/deploy.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  e2e-macos:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build macOS binary
        run: cargo build --release
      - name: Verify Homebrew formula
        run: |
          if [ -f Formula/kyb.rb ]; then
            brew audit --strict Formula/kyb.rb || true
          fi
      - name: Run E2E test on real macOS runner
        run: |
          KYB_DATA=./test-data KYB_INDEX=./test-index ./target/release/kyb-server &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9310/healthz && break
            sleep 0.5
          done
          if [ -f skills/kyb/bin/kyb ]; then
            bash skills/kyb/bin/kyb tags || true
          fi
          kill $SERVER_PID

  # Tag builds only. Branch and PR runs are untouched by this job.
  #
  # ARTIFACT CONTRACT
  #   The release has exactly one supported platform, aarch64-apple-darwin
  #   (Apple Silicon); Intel is unsupported. A v* tag ships exactly one asset,
  #   kyb-${TAG}-aarch64-apple-darwin.tar.gz, whose layout is defined and
  #   verified by scripts/package-macos-arm64.sh and consumed by
  #   packaging/homebrew/kyb.rb.in.
  #
  # RACE AVOIDANCE
  #   The release is created as a draft, the asset is uploaded, and only then is
  #   it published — a consumer can never observe a published release without
  #   its asset. Events created with GITHUB_TOKEN do not start another workflow,
  #   so the final step explicitly dispatches update-homebrew.yml. Re-runs reuse
  #   the existing release and the formula workflow is idempotent.
  release-macos-arm64:
    needs: [test, e2e-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Assert Apple Silicon runner
        run: |
          set -euo pipefail
          kernel="$(uname -s)"
          arch="$(uname -m)"
          echo "runner: $kernel $arch"
          [ "$kernel" = "Darwin" ] || { echo "expected a macOS runner, got $kernel"; exit 1; }
          [ "$arch" = "arm64" ] || { echo "expected an arm64 runner, got $arch"; exit 1; }

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Assert binary architecture
        run: |
          set -euo pipefail
          file target/release/kyb-server
          lipo -archs target/release/kyb-server | tr ' ' '\n' | grep -qx arm64

      - name: Smoke test server and CLI
        run: |
          set -euo pipefail
          export KYB_DATA="${RUNNER_TEMP}/kyb-data" KYB_INDEX="${RUNNER_TEMP}/kyb-index"
          ./target/release/kyb-server &
          server_pid=$!
          healthy=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9310/healthz >/dev/null; then healthy=1; break; fi
            sleep 0.5
          done
          if [ "$healthy" -ne 1 ]; then
            kill "$server_pid" || true
            echo "kyb-server did not answer /healthz"
            exit 1
          fi
          KYB_HOST=127.0.0.1 bash skills/kyb/bin/kyb health
          KYB_HOST=127.0.0.1 bash skills/kyb/bin/kyb tags
          kill "$server_pid"

      - name: Package Apple Silicon release archive
        id: package
        run: ./scripts/package-macos-arm64.sh "$RELEASE_TAG" dist

      - name: Create the GitHub Release as a draft when it does not exist yet
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; reusing it"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "kyb $RELEASE_TAG" \
              --notes "kyb $RELEASE_TAG for aarch64-apple-darwin (Apple Silicon). Intel macOS is not supported."
          fi

      - name: Upload the release asset
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          test -f "$ARCHIVE"
          gh release upload "$RELEASE_TAG" "$ARCHIVE" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish the release
        run: |
          set -euo pipefail
          # No-op when the release is already published.
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Dispatch the Homebrew formula update
        run: |
          set -euo pipefail
          default_branch="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          gh workflow run update-homebrew.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$default_branch" \
            -f "tag=$RELEASE_TAG"

  # Build each Linux architecture on a native GitHub runner, then let Docker's
  # official reusable workflow assemble the multi-platform manifest.  Building
  # linux/arm64 under QEMU on an x86 runner made this job take about an hour;
  # ubuntu-24.04-arm compiles the Rust server directly on ARM hardware.
  docker:
    needs: [test, e2e-macos]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=raw,value=latest
        type=raw,value=${{ github.sha }}
        type=ref,event=tag
      meta-labels: |
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  docker-smoke:
    needs: docker
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      # The image must not just build — the merged manifest must pull on amd64,
      # boot, and answer healthz.
      - name: smoke test image
        run: |
          set -euo pipefail
          docker run -d --name kyb -p 9310:9310 ghcr.io/${{ github.repository }}:latest
          trap 'docker logs kyb || true; docker rm -f kyb || true' EXIT
          for i in $(seq 1 30); do
            curl -sf localhost:9310/healthz && exit 0
            sleep 0.5
          done
          exit 1
