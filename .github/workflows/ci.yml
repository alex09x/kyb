name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history: the authorship check below reads `git shortlog`, and on the
      # default shallow clone it would see one commit and pass vacuously.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Refuse to publish internal infrastructure data
        run: bash scripts/check-no-internal-data.sh
      - name: Validate citation metadata
        run: bash scripts/test-citation.sh
      - name: Verify authorship collapses to one identity
        run: |
          identities=$(git shortlog -sne HEAD | wc -l | tr -d ' ')
          git shortlog -sne HEAD
          if [ "$identities" -ne 1 ]; then
            echo "::error::.mailmap must collapse the history to one identity, got $identities" >&2
            exit 1
          fi
      - name: Validate and install agent skill
        run: bash scripts/test-skill-install.sh
      - name: Verify safe Docker Compose bind
        run: bash scripts/test-compose-bind.sh
      - name: Verify the CLI preflight fails closed
        run: bash scripts/test-cli-preflight.sh
      - name: Verify CLI attribution under nested agents
        run: bash scripts/test-cli-attribution.sh
      - name: Verify incident/task CLI tag presence
        run: python3 scripts/test-cli-tags.py
      - name: Verify tag filtering and incident/task tag forms
        run: node scripts/test-web-tags.cjs
      - name: Validate static website
        run: bash scripts/test-site.sh
      - name: Check the installer (kybmemory.com/install.sh)
        run: shellcheck docs/install.sh scripts/test-install.sh && bash scripts/test-install.sh
      - name: Check deployment script syntax
        run: bash -n scripts/deploy.sh
      - uses: dtolnay/rust-toolchain@stable
      # Builds and tests go through Mitts (https://github.com/alex09x/mitts), not the
      # Cargo CLI. No build cache is restored: every run compiles from scratch.
      - uses: alex09x/mitts@v0.3.28
        with:
          version: v0.3.28
          cache: 'false'
      - run: mitts test --locked -c

  # The golden-vector test skips when no model is present, which would make it a
  # gate that never fires. This job gives it one - cached, so the 120 MB download
  # happens once rather than on every run. Same model the Dockerfile bakes in.
  embedding-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Builds and tests go through Mitts (https://github.com/alex09x/mitts), not the
      # Cargo CLI. No build cache is restored: every run compiles from scratch.
      - uses: alex09x/mitts@v0.3.28
        with:
          version: v0.3.28
          cache: 'false'
      - name: Cache the embedding model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: model
          key: e5-small-int8-Xenova-multilingual-e5-small-v1
      - name: Fetch the embedding model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          repo=Xenova/multilingual-e5-small
          mkdir -p model
          curl -fsSL -o model/model.onnx \
            "https://huggingface.co/${repo}/resolve/main/onnx/model_quantized.onnx"
          curl -fsSL -o model/tokenizer.json \
            "https://huggingface.co/${repo}/resolve/main/tokenizer.json"
      - name: The embedding pipeline still produces the recorded vector
        run: mitts test --locked golden_vector --nocapture

  # The installer from this checkout, run for real on clean runners:
  #   Linux amd64 and arm64 -> Docker; macOS -> Homebrew; macOS forced native -> the
  #   release archive under launchd. Agent homes for Claude Code, Codex and Antigravity
  #   exist first, so the skill must land in all three. Docker and native first install
  #   the previous release, so the rerun is a real upgrade; the tap holds only the
  #   latest formula, so on brew the rerun is the upgrade path at the same version.
  #   The entry written in between must survive, and the skill must still be there once.
  installer-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, first: previous, mode: auto, rerun: docker }
          - { os: ubuntu-24.04-arm, first: previous, mode: auto, rerun: docker }
          - { os: macos-latest, first: latest, mode: auto, rerun: brew }
          - { os: macos-latest, first: previous, mode: native, rerun: native }
    name: installer-smoke (${{ matrix.os }}, ${{ matrix.rerun }})
    runs-on: ${{ matrix.os }}
    env:
      KYB_SITE: file://${{ github.workspace }}/docs
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Agents present on the machine
        run: |
          mkdir -p ~/.claude ~/.codex ~/.gemini/config
          touch ~/.claude/CLAUDE.md ~/.codex/AGENTS.md ~/.gemini/GEMINI.md
      - name: Install (${{ matrix.first }} release, mode ${{ matrix.mode }})
        run: |
          set -euo pipefail
          releases() { gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 2 --json tagName -q ".[$1].tagName"; }
          latest=$(releases 0); previous=$(releases 1)
          echo "LATEST=$latest" >> "$GITHUB_ENV"
          if [ "${{ matrix.first }}" = previous ]; then first=$previous; else first=$latest; fi
          if [ "${{ matrix.first }}" = previous ]; then
            KYB_MODE=${{ matrix.mode }} KYB_VERSION="$first" bash docs/install.sh
          else
            KYB_MODE=${{ matrix.mode }} bash docs/install.sh
          fi
          curl -fsS 127.0.0.1:9310/healthz | grep -q "\"version\":\"${first#v}\""
      - name: The skill is installed for every agent
        run: bash scripts/check-installed-skills.sh 127.0.0.1
      - name: The installed CLI writes and finds an entry
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          printf 'installer smoke\n' | kyb add --key installer-smoke --title "Installer smoke"
          kyb query "installer smoke" | grep -q '"installer-smoke"'
      - name: Running it again upgrades to the latest release and keeps everything
        run: |
          set -euo pipefail
          bash docs/install.sh | tee rerun.log
          grep -q "server=${{ matrix.rerun }}" rerun.log
          curl -fsS 127.0.0.1:9310/healthz | grep -q "\"version\":\"${LATEST#v}\""
          "$HOME/.local/bin/kyb" query "installer smoke" | grep -q '"installer-smoke"'
          bash scripts/check-installed-skills.sh 127.0.0.1

  e2e-macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Builds and tests go through Mitts (https://github.com/alex09x/mitts), not the
      # Cargo CLI. No build cache is restored: every run compiles from scratch.
      - uses: alex09x/mitts@v0.3.28
        with:
          version: v0.3.28
          cache: 'false'
      - name: Build macOS binary
        run: mitts build --release --locked
      - name: Verify Homebrew formula
        run: |
          if [ -f Formula/kyb.rb ]; then
            brew audit --strict Formula/kyb.rb || true
          fi
      - name: Run E2E test on real macOS runner
        run: |
          KYB_DATA=./test-data KYB_INDEX=./test-index ./target/release/kyb-server &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9310/healthz && break
            sleep 0.5
          done
          if [ -f skills/kyb/bin/kyb ]; then
            bash skills/kyb/bin/kyb tags || true
          fi
          bash scripts/test-mcp-endpoint.sh http://127.0.0.1:9310
          kill $SERVER_PID
      # The web UI in a real browser: every screen, every write a person can make
      # from it, against a sandbox server the test starts itself.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Exercise the web UI end to end
        run: KYB_SERVER_BIN=./target/release/kyb-server python scripts/test-web-ui.py --coverage ui-uncovered.txt --min-coverage 100
      - name: Exercise the CLI against a server that asks for tokens
        run: KYB_SERVER_BIN=./target/release/kyb-server bash scripts/test-cli-auth.sh
      - name: Exercise deadlines through the CLI
        run: KYB_SERVER=./target/release/kyb-server bash scripts/test-cli-deadlines.sh
      - name: Exercise CLI exit codes
        run: KYB_SERVER=./target/release/kyb-server bash scripts/test-cli-exit-codes.sh

  # Tag builds only. Branch and PR runs are untouched by this job.
  #
  # ARTIFACT CONTRACT
  #   The release has exactly one supported platform, aarch64-apple-darwin
  #   (Apple Silicon); Intel is unsupported. A v* tag ships exactly one asset,
  #   kyb-${TAG}-aarch64-apple-darwin.tar.gz, whose layout is defined and
  #   verified by scripts/package-macos-arm64.sh and consumed by
  #   packaging/homebrew/kyb.rb.in.
  #
  # RACE AVOIDANCE
  #   The release is created as a draft, the asset is uploaded, and only then is
  #   it published — a consumer can never observe a published release without
  #   its asset. Events created with GITHUB_TOKEN do not start another workflow,
  #   so the final step explicitly dispatches update-homebrew.yml. Re-runs reuse
  #   the existing release and the formula workflow is idempotent.
  release-macos-arm64:
    needs: [test, e2e-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Builds and tests go through Mitts (https://github.com/alex09x/mitts), not the
      # Cargo CLI. No build cache is restored: every run compiles from scratch.
      - uses: alex09x/mitts@v0.3.28
        with:
          version: v0.3.28
          cache: 'false'

      - name: Assert Apple Silicon runner
        run: |
          set -euo pipefail
          kernel="$(uname -s)"
          arch="$(uname -m)"
          echo "runner: $kernel $arch"
          [ "$kernel" = "Darwin" ] || { echo "expected a macOS runner, got $kernel"; exit 1; }
          [ "$arch" = "arm64" ] || { echo "expected an arm64 runner, got $arch"; exit 1; }

      - name: Build release binaries
        run: mitts build --release --locked

      - name: Assert binary architecture
        run: |
          set -euo pipefail
          file target/release/kyb-server
          lipo -archs target/release/kyb-server | tr ' ' '\n' | grep -qx arm64

      - name: Smoke test server and CLI
        run: |
          set -euo pipefail
          export KYB_DATA="${RUNNER_TEMP}/kyb-data" KYB_INDEX="${RUNNER_TEMP}/kyb-index"
          ./target/release/kyb-server &
          server_pid=$!
          healthy=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9310/healthz >/dev/null; then healthy=1; break; fi
            sleep 0.5
          done
          if [ "$healthy" -ne 1 ]; then
            kill "$server_pid" || true
            echo "kyb-server did not answer /healthz"
            exit 1
          fi
          KYB_HOST=127.0.0.1 bash skills/kyb/bin/kyb health
          KYB_HOST=127.0.0.1 bash skills/kyb/bin/kyb tags
          kill "$server_pid"

      - name: Package Apple Silicon release archive
        id: package
        run: ./scripts/package-macos-arm64.sh "$RELEASE_TAG" dist

      - name: Create the GitHub Release as a draft when it does not exist yet
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; reusing it"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "kyb $RELEASE_TAG" \
              --notes "kyb $RELEASE_TAG for aarch64-apple-darwin (Apple Silicon). Intel macOS is not supported."
          fi

      - name: Upload the release asset
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          test -f "$ARCHIVE"
          gh release upload "$RELEASE_TAG" "$ARCHIVE" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish the release
        run: |
          set -euo pipefail
          # No-op when the release is already published.
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Dispatch the Homebrew formula update
        run: |
          set -euo pipefail
          default_branch="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          gh workflow run update-homebrew.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$default_branch" \
            -f "tag=$RELEASE_TAG"

  # Build each Linux architecture on a native GitHub runner, then let Docker's
  # official reusable workflow assemble the multi-platform manifest.  Building
  # linux/arm64 under QEMU on an x86 runner made this job take about an hour;
  # ubuntu-24.04-arm compiles the Rust server directly on ARM hardware.
  docker:
    needs: [test, e2e-macos]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=raw,value=latest
        type=raw,value=${{ github.sha }}
        type=ref,event=tag
      meta-labels: |
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  docker-smoke:
    needs: docker
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      # The image must not just build — the merged manifest must pull on amd64,
      # boot, and answer healthz.
      # The digest the docker job published is what is smoke-tested and what deploy.sh
      # installs: tags (`latest`, the SHA) can be rebuilt, a digest cannot change.
      - name: the digest the docker job published
        run: |
          set -euo pipefail
          digest='${{ needs.docker.outputs.digest }}'
          case "$digest" in sha256:*) ;; *) echo "::error::no digest from the docker job: '$digest'"; exit 1;; esac
          echo "$digest" > image-digest.txt
          echo "image: ghcr.io/${{ github.repository }}@$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: smoke test image
        run: |
          set -euo pipefail
          docker run -d --name kyb -p 9310:9310 "ghcr.io/${{ github.repository }}@$(cat image-digest.txt)"
          trap 'docker logs kyb || true; docker rm -f kyb || true' EXIT
          for i in $(seq 1 30); do
            curl -sf localhost:9310/healthz && exit 0
            sleep 0.5
          done
          exit 1
      # Published only after the smoke passed, so the artifact always names a tested image;
      # overwrite, so a rerun of this job can publish again instead of failing on the name.
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
          retention-days: 90
          overwrite: true
