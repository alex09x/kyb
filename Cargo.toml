[package]
name = "knowyourbusiness"
version = "0.1.4"
edition = "2021"
description = "Git-backed, searchable knowledge base and incident tracker for AI agent fleets"
license = "MIT"
repository = "https://github.com/alex09x/kyb"

[[bin]]
name = "kyb-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tantivy = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# default-features off: local git operations only (no ssh/https/openssl)
git2 = { version = "0.20", default-features = false }
chrono = "0.4"
anyhow = "1"
dotenvy = "0.15"
regex = "1"
ort = { version = "2.0.0-rc.10", features = ["ndarray"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ndarray = "0.17"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rstest = "0.26.1"
